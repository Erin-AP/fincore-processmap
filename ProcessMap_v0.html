<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全週期作業流程系統地圖 (九大模組版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .step-card { min-height: 240px; transition: all 0.2s ease; position: relative; }
        .step-card:hover { border-color: #3b82f6; transform: translateY(-2px); }
        .source-tags { position: absolute; bottom: 8px; right: 8px; display: flex; gap: 4px; }
        .tab-btn.active { background-color: #2563eb; color: white; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); transform: scale(1.05); }
    </style>
</head>
<body class="bg-slate-100 p-8">
    <header class="mb-8 border-l-8 border-blue-600 pl-6">
        <h1 class="text-3xl font-black text-slate-800 uppercase tracking-tight">全週期作業流程系統地圖</h1>
        <p class="text-lg text-slate-500 font-medium mt-1">整合 SOP、1st訪談及補充資料 - 企業級導航版</p>
    </header>

    <!-- Main Categories (9 Tabs) -->
    <nav id="category-nav" class="flex flex-wrap gap-2 mb-10 bg-white p-3 rounded-xl shadow-sm border border-slate-200 sticky top-4 z-50">
        <!-- JS will populate these -->
    </nav>

    <div id="main-content" class="min-h-[600px]">
        <!-- JS will populate based on active category -->
    </div>

    <script>
        const CATEGORIES = ['財產管理', '請購報銷(台幣)', '請購報銷(外幣)', '收款', '營業稅', '票據', '總帳', '預算', '差旅'];
        
        const DATA = {
            '財產管理': [
                {
                    title: 'A01 一般財產新增與入帳',
                    steps: [
                        { name: 'Step 1: 建立請購單', role: '承辦人/業務單位', input: '採購需求、報價單', output: '請購單 (A單)', system: 'iService', sources: ['1st訪談', '補充資料'] },
                        { name: 'Step 2: 報銷與驗收核章', role: '承辦人/業務單位', input: '請購單、驗收文件、發票', output: '報銷完成紀錄', system: 'iService', sources: ['1st訪談', '補充資料'] },
                        { name: 'Step 3: 送事務組驗收', role: '業務單位', input: '報銷單', output: '驗收單', system: '紙本', sources: ['補充資料'] },
                        { name: 'Step 4: 填寫財產增加單', role: '使用單位', input: '採購合約、規格', output: '財產增加單', system: '紙本/電子系統', sources: ['SOP'] },
                        { name: 'Step 5: 器材處會計確認', role: '器材處', input: 'A單/E單', output: 'W單', system: '財務系統', sources: ['補充資料'] },
                        { name: 'Step 6: APF2H00 憑證登錄', role: '財產管理人員', input: '統一發票', output: '憑證登錄紀錄', system: 'APF2H00', sources: ['補充資料'] },
                        { name: 'Step 7: 輸入財產基本資料', role: '財產管理人員', input: '基本資料', output: '財產卡 (草稿)', system: '資料登錄', sources: ['1st訪談', '補充資料'] },
                        { name: 'Step 8: 匯率換算', role: '財產管理人員', input: '外幣金額', output: '台幣金額', system: '財務系統', sources: ['1st訪談', '補充資料'] },
                        { name: 'Step 9: 列印標籤與財產單', role: '財產管理人員', input: '已建檔資料', output: '標籤、四聯單', system: 'FAR', sources: ['SOP', '1st訪談', '補充資料'] },
                        { name: 'Step 10: 各單位用印', role: '行政處、承辦單位', input: '四聯單', output: '已用印單據', system: '紙本', sources: ['1st訪談', '補充資料'] },
                        { name: 'Step 11: 黏貼財產標籤', role: '業務主管單位', input: '標籤、實體', output: '已貼標財產', system: '人工', sources: ['SOP', '補充資料'] },
                        { name: 'Step 12: 送企財核銷', role: '業務單位', input: '請購單+財產單', output: '核銷申請', system: '紙本', sources: ['補充資料'] },
                        { name: 'Step 13: 執行財產登錄', role: '企財處 (財會)', input: '核銷資料', output: '登錄資料', system: 'FAF2100', sources: ['1st訪談', '補充資料'] },
                        { name: 'Step 14: 批次過帳', role: '系統自動', input: '登錄資料', output: '傳票', system: '背景作業', sources: ['補充資料'] },
                        { name: 'Step 15: 入帳製票', role: '企財處 (財會)', input: '登錄資料', output: '新增傳票', system: 'GLF2A00', sources: ['1st訪談', '補充資料'] }
                    ]
                },
                {
                    title: 'A03 財產報廢與除帳',
                    steps: [
                        { name: 'Step 1: 提出報廢公文', role: '業務單位', input: '財產清單', output: '報廢公文', system: '公文系統', sources: ['SOP', '1st訪談', '補充資料'] },
                        { name: 'Step 4: 執行報廢登錄', role: '財產管理人員', input: '核准文件', output: '報廢單', system: 'FAF2400', sources: ['SOP', '1st訪談', '補充資料'] },
                        { name: 'Step 8: 確認並產製傳票', role: '企財處', input: '報廢文件', output: '傳票', system: 'FAF2400', sources: ['1st訪談', '補充資料'] }
                    ]
                }
                // ... (can add others here as well)
            ]
        };

        function renderContent(category) {
            const container = document.getElementById('main-content');
            container.innerHTML = '';
            
            const scenarios = DATA[category];
            
            if (!scenarios || scenarios.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl p-24 border-4 border-dashed border-slate-200 text-center flex flex-col items-center">
                        <div class="w-20 h-20 bg-slate-50 rounded-full flex items-center justify-center mb-6 shadow-inner text-slate-300 transform scale-150">📄</div>
                        <h3 class="text-2xl font-black text-slate-400 mb-3 tracking-tight">「${category}」流程資料準備中</h3>
                        <p class="text-slate-400 font-medium max-w-md">目前系統地圖正優先補齊「財產管理」模組，其他八大模組將陸續導入。</p>
                    </div>
                `;
                return;
            }

            scenarios.forEach(scenario => {
                const section = document.createElement('div');
                section.className = 'grid grid-cols-[200px_1fr] bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden mb-8';
                
                const stepsHtml = scenario.steps.map((step, idx) => `
                    <div class="flex items-center flex-shrink-0">
                        <div class="w-96 bg-slate-50 rounded-xl border border-slate-200 p-6 flex flex-col step-card shadow-sm">
                            <div class="mb-4 border-b-2 border-slate-200 pb-3">
                                <div class="text-[18px] font-black text-blue-600 uppercase tracking-tight leading-snug">${step.name}</div>
                            </div>
                            <div class="space-y-4 mb-6">
                                <div class="flex flex-col">
                                    <span class="text-[11px] font-bold text-slate-400 uppercase mb-1">輸入資料</span>
                                    <span class="text-[14px] text-slate-700 font-semibold leading-relaxed">${step.input || '無'}</span>
                                </div>
                                <div class="flex flex-col">
                                    <span class="text-[11px] font-bold text-slate-400 uppercase mb-1">輸出資料</span>
                                    <span class="text-[14px] text-slate-700 font-semibold leading-relaxed">${step.output || '無'}</span>
                                </div>
                            </div>
                            <div class="mt-auto space-y-3 pb-6">
                                <div class="flex flex-col bg-white p-3 rounded-lg border-2 border-slate-100">
                                    <div class="flex justify-between items-center mb-2">
                                        <span class="text-[10px] font-bold text-slate-400 uppercase">系統 / 工具</span>
                                        <span class="text-[13px] text-blue-700 font-black">${step.system || '-'}</span>
                                    </div>
                                    <div class="flex justify-between items-center">
                                        <span class="text-[10px] font-bold text-slate-400 uppercase">執行角色</span>
                                        <span class="text-[13px] text-slate-600 font-bold">${step.role || '-'}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="source-tags">
                                ${step.sources.map(s => `<span class="text-[10px] px-2 py-1 rounded font-black uppercase border ${s === 'SOP' ? 'bg-amber-100 text-amber-700 border-amber-200' : s === '1st訪談' ? 'bg-indigo-100 text-indigo-700 border-indigo-200' : 'bg-emerald-100 text-emerald-700 border-emerald-200'}">${s}</span>`).join('')}
                            </div>
                        </div>
                        ${idx < scenario.steps.length - 1 ? '<div class="mx-6 text-slate-300 font-black text-4xl">→</div>' : ''}
                    </div>
                `).join('');

                section.innerHTML = `
                    <div class="bg-slate-800 text-white flex items-center justify-center text-center p-8 font-black text-xl leading-tight tracking-tight uppercase border-r-4 border-blue-600">${scenario.title}</div>
                    <div class="flex items-center p-10 gap-2 overflow-x-auto no-scrollbar bg-white">${stepsHtml}</div>
                `;
                container.appendChild(section);
            });
        }

        function switchCategory(index) {
            const btns = document.querySelectorAll('.tab-btn');
            btns.forEach((btn, i) => {
                if (i === index) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            renderContent(CATEGORIES[index]);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const nav = document.getElementById('category-nav');
            CATEGORIES.forEach((cat, idx) => {
                const btn = document.createElement('button');
                btn.className = 'tab-btn px-6 py-3 rounded-lg font-black text-sm uppercase transition-all duration-200 hover:bg-blue-50 text-slate-600';
                btn.innerText = cat;
                btn.onclick = () => switchCategory(idx);
                nav.appendChild(btn);
            });
            switchCategory(0); // Default to first category
        });
    </script>
</body>
</html>
