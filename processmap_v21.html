務組交辦業務單位追蹤履約","description":"事務組完成採購程序後，由業務單位通知得標廠商並進行後續履約追蹤","role":"行政處事務組、業務單位","input":"核定採購案","output":"議價/決標結果通知、履約聯絡","system":"iService、人工","manHours":"","frequency":"","sources":["SOP","1st訪談"]},{"id":"exp01-7","name":"Step 7: 業務驗收與應附表單","description":"業務單位驗收，蓋章。財產標的（金額≥1萬且耐用2年以上）併辦財產單（壹式四聯）；海外展團裝潢併辦裝潢查驗紀錄表；逾150萬另辦國內外財物勞務驗收證明單，超過300萬加會稽核室","role":"業務單位","input":"交貨/完工","output":"驗收簽章＋必備表單","system":"紙本","manHours":"","frequency":"","sources":["SOP","1st訪談","補充資料"]},{"id":"exp01-8","name":"Step 8: iService 報銷併紙本","description":"業務單位在iService報銷申請，憑證黏貼經費報銷用紙並加蓋騎縫章後送企財處","role":"業務單位","input":"驗收與原始憑證、其他附件（如報價單、驗收單、驗收照片）","output":"iService申請＋紙本送件","system":"iService、紙本","manHours":"","frequency":"","sources":["SOP","1st訪談","補充資料","2nd訪談"]},{"id":"exp01-9","name":"Step 9: 登錄報銷資料","description":"在財務系統「請購暨報銷」由iService帶入A單，或自行新增G單；登錄報銷計畫/科目/金額/憑證明細。模組參考APF2600","role":"業務單位","input":"A單號或G單、計畫科目金額、原始憑證","output":"財務系統報銷明細＋憑證明細","system":"財務系統（APF2600）","manHours":"","frequency":"","sources":["1st訪談","補充資料"]},{"id":"exp01-10","name":"Step 10: 核銷","description":"企財處審核計畫/科目/金額/摘要，及憑證類別（如21/22/25/99等）/日期/稅額/廠商統編或受款人（如為國外服務）等","role":"企財處","input":"原始憑證與報銷紙本附件（如報價單、驗收照片等）","output":"傳票附件","system":"財務系統（APF2700）","manHours":"","frequency":"","sources":["1st訪談","補充資料","2nd訪談"]},{"id":"exp01-11","name":"Step 11: 確認製票/帳務","description":"以核銷單據種類（如請購單、直接報銷單等）輸入單據號碼執行製票。模組參考APF2A00","role":"企財處","input":"憑證齊、核銷帶入正確","output":"傳票檢查表","system":"財務系統（APF2A00）","manHours":"","frequency":"","sources":["補充資料","1st訪談"]},{"id":"exp01-12","name":"Step 12: 列印傳票檢查表並覆核","description":"將列印出紙本的傳票檢查表及附件送組長／副座覆核","role":"企財處","input":"待過帳傳票","output":"已覆核可過帳之傳票檢查表","system":"財務系統、紙本","manHours":"","frequency":"","sources":["SOP","1st訪談","補充資料"]},{"id":"exp01-13","name":"Step 13: 批次過帳","description":"財務系統固定排程於午/晚批次過帳。急件得權責者手動過帳。正式傳票號取得可能有等待期","role":"企財處","input":"已覆核可過帳之傳票檢查表製票號碼","output":"已過帳與傳票號","system":"財務系統","manHours":"","frequency":"","sources":["SOP","1st訪談","補充資料"]},{"id":"exp01-14","name":"Step 14: 刷送傳票至出納","description":"企財處完成過帳後，於財務系統（GLF2H00）刷送傳票至出納組並產生批號，出納以批號查詢、核對筆數後簽收，方可進行選付作業。EXP01 到此為止，後續銜接出納付款流程（EXP04、EXP06）","role":"企財處","input":"批次過帳完成之傳票","output":"已刷送傳票","system":"財務系統（GLF2H00）、人工","manHours":"","frequency":"","sources":["1st訪談","線下回饋_出納","2nd訪談"]}]},{"id":"EXP02","title":"EXP02 一般費用報銷補正流程","description":"","steps":[{"id":"exp02-1","name":"Step 1: 業務單位送件報銷","description":"業務單位在iService報銷申請（一般費用或E單均適用），黏貼憑證用紙後紙本送企財處","role":"業務單位","input":"報銷申請＋憑證","output":"可審之報銷件","system":"iService、紙本","manHours":"","frequency":"","sources":["SOP","補充資料"]},{"id":"exp02-2","name":"Step 2: 企財處審金額與憑證","description":"審核簽核層級、科目、內容等","role":"企財處","input":"已送件之報銷","output":"審核結果","system":"財務系統、人工","manHours":"","frequency":"","sources":["SOP","1st訪談","補充資料","2nd訪談"]},{"id":"exp02-3","name":"Step 3: 審核層級合規確認","description":"6萬（含）以下組長；逾80萬得秘書長授權主辦會計核定。異常支出一律簽報秘書長","role":"業務單位、企財處","input":"報銷內容與核准層","output":"合規之簽准","system":"人工","manHours":"","frequency":"","sources":["SOP","補充資料","2nd訪談"]},{"id":"exp02-4","name":"Step 4: 開立經費報銷補正通知單","description":"文件不齊備時，開立「經費報銷補正通知單」","role":"企財處","input":"審核結果（缺件/漏章）","output":"補正通知單","system":"紙本","manHours":"","frequency":"","sources":["SOP","補充資料"]},{"id":"exp02-5","name":"Step 5: 依情況原卷暫存或原卷退還","description":"依情況採原卷暫存（待補正）或原卷退還（補正後重送）；退件時案件編號退回原單位，以iService/文案系統單號對應追蹤","role":"企財處、業務單位","input":"補正通知單","output":"待補正件","system":"紙本、iService、文案系統","manHours":"","frequency":"","sources":["SOP","1st訪談","補充資料","2nd訪談"]},{"id":"exp02-6","name":"Step 6: 業務單位補件補章後重送企財","description":"業務單位補件、補章後重送企財處","role":"業務單位","input":"補正需求","output":"補正完備件","system":"iService、紙本","manHours":"","frequency":"","sources":["SOP","補充資料"]},{"id":"exp02-7","name":"Step 7: 審核通過後編製支出傳票","description":"審核通過後編製支出傳票，結束後接回EXP01 Step 12（列印傳票檢查表並覆核）","role":"企財處","input":"審畢之報銷","output":"待過帳傳票","system":"財務系統","manHours":"","frequency":"","sources":["SOP","1st訪談","補充資料","2nd訪談"]}]},{"id":"EXP03","title":"EXP03 週轉金小額支付與撥補流程","description":"","steps":[{"id":"exp03-1","name":"Step 1: 申請設置週轉金並指定保管人","description":"業務單位提出線上公文申請，核定額度與保管人","role":"業務單位","input":"週轉金申請","output":"核准額度與保管人","system":"文案系統","manHours":"","frequency":"","sources":["SOP","補充資料","2nd訪談"]},{"id":"exp03-2","name":"Step 2: 撥付週轉金並啟用備查簿","description":"企財處依核定金額編製傳票，出納組將款項撥入指定帳戶，保管人啟用備查簿登錄收支","role":"企財處、行政處出納組、週轉金保管單位","input":"核准文件","output":"備查簿就緒","system":"財務系統、人工、備查簿","manHours":"","frequency":"","sources":["SOP","補充資料"]},{"id":"exp03-3","name":"Step 3: 門檻確認：≤1萬得週轉金直接現金支付","description":"≤1萬得完成請採購程序後由週轉金直接現金支付","role":"行政處事務組","input":"採購/支出金額性質","output":"是否走週轉金路徑","system":"iService","manHours":"","frequency":"","sources":["SOP","補充資料","2nd訪談"]},{"id":"exp03-4","name":"Step 4: 採購人員向週轉金保管單位申請撥款","description":"採購人員填請購單報銷欄，附發票，向週轉金保管單位申請撥款","role":"業務單位","input":"採購需求及發票","output":"撥款申請","system":"紙本","manHours":"","frequency":"","sources":["SOP","補充資料","2nd訪談"]},{"id":"exp03-5","name":"Step 5: 現金付款與簽收","description":"保管單位審核，以現金支付；領款人簽收；在已支付的報銷單上加蓋「已支付」戳記，登錄備查簿","role":"週轉金保管單位","input":"請購單＋發票","output":"簽收紀錄＋備查簿更新","system":"紙本、備查簿","manHours":"","frequency":"","sources":["SOP","補充資料","2nd訪談"]},{"id":"exp03-6","name":"Step 6: 彙總已付款報銷單列印週轉金報銷清單","description":"週轉金保管人彙總已付款之報銷單，列印週轉金報銷清單","role":"週轉金保管單位","input":"多筆請購單＋發票","output":"週轉金報銷清單","system":"財務系統、iService","manHours":"","frequency":"","sources":["SOP","1st訪談","補充資料","線下回饋_出納","2nd訪談"]},{"id":"exp03-7","name":"Step 7: 企財處審核編傳票出納補足週轉金","description":"企財處審核並編製支出傳票，結束後接回EXP01 Step 12；出納組撥款補足週轉金","role":"企財處、行政處出納組","input":"週轉金報銷清單","output":"支出傳票＋補款","system":"財務系統、票據","manHours":"","frequency":"","sources":["SOP","補充資料","2nd訪談"]},{"id":"exp03-8","name":"Step 8: 年度週轉金盤點","description":"每年六月辦理年度盤點；編製盤點表，經保管單位主管簽核，企財處監督盤點","role":"業務單位、企財處","input":"備查簿/實地盤點","output":"盤點表（年度）","system":"文案系統","manHours":"","frequency":"","sources":["補充資料","2nd訪談"]}]},{"id":"EXP04-a1","title":"EXP04-a1 台幣支票付款","description":"","steps":[{"id":"exp04-a1-1","name":"Step 1: 簽收傳票","description":"出 ,"sources":["補充資料"]},{"id":"ar12-4","name":"Step 4: 列印電子發票檢查表","description":"上傳後，列印電子發票檢查表，確認回饋狀態為C成功，附在最初的收款或票據流程文件中，送主管覆核","role":"行政處出納組","input":"單位/傳票號碼/發票日期","output":"電子發票檢查表","system":"財務系統（COR4H00）","manHours":"","frequency":"","sources":["1st訪談","補充資料","2nd訪談"]},{"id":"ar12-5","name":"Step 5: 上傳若有異常","description":"上傳若有異常，可下載報表查詢，亦須詢問系統工程師","role":"行政處出納組","input":"—","output":"報表","system":"財務系統（COR4I00）","manHours":"","frequency":"","sources":["補充資料"]}]},{"id":"AR13","title":"AR13 作廢發票流程(過帳前)","description":"作廢發票流程(過帳前)","steps":[{"id":"ar13-1","name":"Step 1: 作廢發票","description":"選擇需作廢的發票號碼，選擇作廢原因確認，系統將原發票轉為V單，列印作廢發票上傳平台成功的電子發票檢查表","role":"行政處出納組","input":"發票號碼","output":"V單號","system":"財務系統（COF2610、COR4H00、GLF2800）","manHours":"","frequency":"","sources":["補充資料"]}]},{"id":"AR14","title":"AR14 發票拆分","description":"發票拆分","steps":[{"id":"ar14-1","name":"Step 1: 若需拆分","description":"點選拆分明細新增資料，手動修改序號及金額，確保拆分後總額一致，確認後列印新發票，列印電子發票檢查表","role":"行政處出納組","input":"V單號","output":"拆分後之新發票","system":"財務系統（COF2610、COR4H00）","manHours":"","frequency":"","sources":["1st訪談","補充資料"]}]},{"id":"AR15","title":"AR15 發票品名維護","description":"發票品名維護","steps":[{"id":"ar15-1","name":"Step 1: 進入基本資料建檔功能","description":"新增或修改發票品名，確認符合營業項目，儲存後系統於開立繳款單時帶入更新品名","role":"行政處出納組","input":"維護需求","output":"更新後品名資料","system":"財務系統（COF1200）","manHours":"","frequency":"","sources":["1st訪談","補充資料","2nd訪談"]}]},{"id":"AR16","title":"AR16 發票郵寄清冊列印","description":"發票郵寄清冊列印","steps":[{"id":"ar16-1","name":"Step 1: 列印郵寄清冊","description":"輸入日期以及勾選須寄出的發票資料","role":"行政處出納組","input":"發票日期區間、發票單位","output":"郵寄清冊","system":"財務系統（NTR4A00）","manHours":"","frequency":"","sources":["補充資料","2nd訪談"]},{"id":"ar16-2","name":"Step 2: 送郵寄室","description":"送郵寄室郵寄","role":"行政處出納組","input":"發票跟郵寄清冊","output":"紀錄掛號單的郵寄清冊","system":"人工","manHours":"","frequency":"","sources":["補充資料"]}]},{"id":"AR17","title":"AR17 預開發票流程","description":"預開發票流程","steps":[{"id":"ar17-1","name":"Step 1: 接獲廠商(政府)通知，簽請企財處預開發票","description":"業務單位接獲廠商通知（如政府單位需先有發票才能請款），以文案系統送「作廢銷貨折讓重開發票退費申請表」，簽請企財處預開發票","role":"業務單位","input":"廠商通知","output":"公文","system":"人工、文案系統","manHours":"","frequency":"","sources":["補充資料","2nd訪談"]},{"id":"ar17-2","name":"Step 2: 預開發票帳務處理","description":"於繳款通知單確認（COF2200）輸入繳款單條件，勾選要預開的繳款單，產生 N 單（其他應收款，帶出繳款單號）；以 N 單製票（COF2700），列印傳票並過帳後送行政處出納組。須用 N 單，不可用收款沖銷（COF2300）開 R 單，否則前端（如場館系統）會判定為已收款。","role":"企財處","input":"公文","output":"已過帳之傳票","system":"財務系統（COF2200、COF2700）","manHours":"","frequency":"","sources":["補充資料","2nd訪談"]},{"id":"ar17-3","name":"Step 3: 根據傳票開立發票","description":"根據傳票開立發票，並列印電子發票檢查表，通知業務單位承辦人","role":"行政處出納組","input":"已過帳之傳票","output":"發票","system":"財務系統（COF2610、COR4A00、COR4H00）","manHours":"","frequency":"","sources":["補充資料"]}]},{"id":"AR18","title":"AR18 作廢發票帳務處理(已過帳之傳票)","description":"已過帳之傳票作廢發票流程","steps":[{"id":"ar18-1","name":"Step 1: 接獲廠商通知，簽請企財處作廢發票","description":"業務單位接獲廠商通知，以文案系統送「作廢銷貨折讓重開發票退費申請表」，簽請企財處作廢發票","role":"業務單位","input":"廠商通知","output":"公文","system":"人工、文案系統","manHours":"","frequency":"","sources":["補充資料","2nd訪談"]},{"id":"ar18-2","name":"Step 2: 作廢發票帳務處理(已過帳之傳票)","description":"有繳款單的發票，於銷貨退回處理（COF2800）輸入發票號碼，帶出收款人與銷退明細，承辦人自行輸入；確認時系統詢問「是否作廢」，選「是」，產生 U 單後製票（COF2700）、過帳，傳票送行政處出納組。作廢後發票加作廢註記，可於發票補輸入（GLF2800）查「是否作廢」確認。限發票與帳務日期同月份，跨月只能折讓（AR19）。","role":"企財處","input":"公文","output":"已過帳之傳票","system":"財務系統（COF2800、COF2700、GLF2800）","manHours":"","frequency":"","sources":["補充資料","2nd訪談"]},{"id":"ar18-3","name":"Step 3: 根據傳票列印電子發票檢查表","description":"根據傳票列印電子發票檢查表(確認作廢上傳)","role":"行政處出納組","input":"已過帳之傳票","output":"電子發票檢查表","system":"財務系統（COR4H00）","manHours":"","frequency":"","sources":["補充資料"]}]},{"id":"AR19","title":"AR19 折讓發票流程","description":"折讓發票流程","steps":[{"id":"ar19-1","name":"Step 1: 接獲廠商通知，簽請企財處折讓發票","description":"業務單位接獲廠商通知，以文案系統送「作廢銷貨折讓重開發票退費申請表」，簽請企財處折讓發票","role":"業務單位","input":"廠商通知","output":"公文","system":"人工、文案系統","manHours":"","frequency":"","sources":["補充資料","2nd訪談"]},{"id":"ar19-2","name":"Step 2: 折讓發票帳務處理","description":"於銷貨退回處理（COF2800）輸入發票號碼，確認時「是否作廢」選「否」即為銷退（折讓），產生 U 單後製票（COF2700）、過帳，傳票送行政處出納組；可於發票補輸入（GLF2800）明細區確認銷退稅額有數字。","role":"企財處","input":"公文","output":"已過帳之傳票","system":"財務系統（COF2800、COF2700、GLF2800）","manHours":"","frequency":"","sources":["補充資料","2nd訪談"]},{"id":"ar19-3","name":"Step 3: 根據傳票列印電子發票檢查表","description":"根據傳票列印電子發票檢查表(確認折讓上傳)","role":"行政處出納組","input":"已過帳之傳票","output":"電子發票檢查表","system":"財務系統（COR4H00）","manHours":"","frequency":"","sources":["補充資料"]}]},{"id":"AR20","title":"AR20 收款結算(Q)","description":"收款結算(Q)","steps":[{"id":"ar20-1","name":"Step 1: 判斷結算情境","description":"依收款性質判斷屬於退保證金（含履約保證金）、場館／展場結算，或會內對開等情境，選擇對應情境進入收款結算(Q)畫面處理；並非每一種收款都會用到Q","role":"企財處","input":"繳款單(P單)","output":"結算情境判斷","system":"財務系統（COF2400）","manHours":"","frequency":"","sources":["2nd訪談"]},{"id":"ar20-2","name":"Step 2: 退保證金－系統自動計算應退金額","description":"輸入單位、P單號，系統先判斷該批單是否已收款，再依科目性質計算應退金額：屬收入科目者顯示於收入區塊，屬保證金科目（非收入）者僅顯示於應退金額欄位。結算後，製作傳票 (W單)。","role":"企財處","input":"繳款單(P單)、發票單位","output":"應退金額、結算單號(Q單)、結算製票 (W單)","system":"財務系統（COF2400、COF2700）","manHours":"","frequency":"","sources":["2nd訪談"]},{"id":"ar20-3","name":"Step 3: 場館結算－多批單合併輸入計算應補繳/應退","description":"輸入單位、多張P單號，可逐張輸入確認，系統帶出各P單下場地、設備、水電等收入科目明細，點擊結算後自動帶出預繳金額、收入合計，並計算應補繳或應退金額。結算後，製作傳票 (W單)。","role":"企財處","input":"繳款單(P單，多張)","output":"應補繳/應退金額、結算單號(Q單)、結算製票 (W單)","system":"財務系統（COF2400、COF2700）","manHours":"","frequency":"","sources":["2nd訪談"]},{"id":"ar20-4","name":"Step 4: 場館結算應補繳金額之後續處理","description":"若結算判斷有應補繳金額，結算後製票，系統會自動產生一張新P單 (214101 應付憑單)、'V單號，並待廠商實際繳款後才開立發票（先掛應收）","role":"企財處","input":"應補繳金額","output":"新繳款單(P單)、應收傳票","system":"財務系統（COF2400、COF2700）","manHours":"","frequency":"","sources":["2nd訪談"]},{"id":"ar20-5","name":"Step 5: 場館結算應退金額之後續處理","description":"若結算判斷有應退金額，且先前已收款並開立發票，須做銷貨退回處理(COF2800)。輸入發票號碼、結算單號，系統自動將結算單號與該發票連結，產生銷退單號（U單）","role":"企財處","input":"結算資料、原發票號碼","output":"銷退單號 (U單)","system":"財務系統（COF2800）","manHours":"","frequency":"","sources":["2nd訪談"]},{"id":"ar20-6","name":"Step 6: 會內對開發票之帳務結算","description":"會內對開（不實際收付款）僅需將P單「Q」起來做記號即可，不需另外處理傳票","role":"企財處","input":"繳款單(P單)","output":"結算單號 (Q單)","system":"財務系統（COF2400）","manHours":"","frequency":"","sources":["2nd訪談"]}]},{"id":"AR21","title":"AR21 三聯式收銀機作帳流程-地方辦事處","description":"三聯式收銀機作帳流程-地方辦事處","steps":[{"id":"ar21-1","name":"Step 1: 辦事處郵寄收入帳資料","description":"每月月初，辦事處將上個月的收入帳郵寄給企財處，核對以下資料：收銀機交易檔 (.txt)、收入明細表、 買斷書月分攤表及銷售月報表、 代銷書月分攤表及銷售月報表、 代銷書進書單據應稅類結帳表、 代銷書進書單據免稅類結帳表、 會內書月分攤表及銷售月報表、 發票作廢明細表、 統一發票明細表、 日帳條、 佣金收入交易檔 (.txt，如果有)","role":"地方辦事處（臺中、臺南、高雄）","input":"-","output":"-","system":"人工","manHours":"","frequency":"","sources":[]},{"id":"ar21-2","name":"Step 2: 轉入收銀機交易檔 (.txt)","description":"輸入帳務資料，轉入收銀機交易檔後，系統會自動產生收款單號 (R單)、貸方合計、沖銷明細，需再輸入借方資料 (收款科目-115104 其他應收款、幣別、收款金額)，確認借貸平衡","role":"企財處","input":"帳務日期 (上個月的最後一天)、發票單位、收款種類 (4. 電收銀機)、收款人員編、責任單位、計畫年度","output":"收款單號 (R單)、貸方合計、沖銷明細 (含P單號)","system":"財務系統（COF2500）","manHours":"","frequency":"","sources":[]},{"id":"ar21-3","name":"Step 3: 收款製票","description":"輸入製票資料產生傳票，修改每一筆會計科目對應的摘要內容","role":"企財處","input":"製票人員 (收款人)、製票條件 (其他收款單)、R單號","output":"收款傳票檢查表 (W單)","system":"財務系統（COF2700）","manHours":"","frequency":"","sources":[]},{"id":"ar21-4","name":"Step 4: 送主管審核並過帳","description":"收款傳票檢查表送組長、副座審核，審核完畢由財會人員送過帳 (等中午或午夜批次過帳後， 隔天系統會排程列印傳票)","role":"企財處","input":"收款傳票檢查表 (W單)","output":"已過帳之傳票","system":"財務系統（GLF2200）","manHours":"","frequency":"","sources":[]}]},{"id":"AR22","title":"AR22 佣金收入作帳流程","description":"佣金收入作帳流程","steps":[{"id":"ar22-1","name":"Step 1: 查詢本月是否有佣金收入","description":"每月月初，做完辦事處收入帳後，代銷書會入227104-代收承銷款。先以會計科目明細查詢是否有這筆收入，並核對金額是否正確。","role":"企財處","input":"會計科目(227104)、帳務起迄日、責任中心","output":"227104-代收承銷款明細","system":"財務系統（GLF3700）","manHours":"","frequency":"","sources":[]},{"id":"ar22-2","name":"Step 2: 轉入佣金收入交易檔 (.txt)","description":"核對以下資料：佣金收入交易檔 (.txt)、代銷書月分攤表及銷售月報表、代銷書進書單據免稅類結帳表、代銷書進書單據應稅類結帳表。 輸入帳務資料，轉入佣金收入交易檔後，系統會自動製票。","role":"企財處","input":"店名 (年度+門市店號+計畫+預算項目+責任中心)、帳務日期 (次月的第一天)","output":"收款傳票檢查表 (W單)","system":"財務系統（COF2C00）","manHours":"","frequency":"","sources":[]},{"id":"ar22-3","name":"Step 3: 送主管審核並過帳後","description":"收款傳票檢查表送組長、副座審核，審核完畢由財會人員送過帳，列印傳票","role":"企財處","input":"收款傳票檢查表 (W單)","output":"已過帳之傳票","system":"財務系統（GLF2200）","manHours":"","frequency":"","sources":[]},{"id":"ar22-4","name":"Step 4: 傳票送出納開發票，再送回企財","description":"接收已過帳之傳票，開立正式發票號碼，檢查發票上傳成功後，傳票再刷送回企財","role":"行政處出納組","input":"已過帳之傳票","output":"發票號碼","system":"財務系統（GLF2H00、COF2610、COR4A00、COR4H00）","manHours":"","frequency":"","sources":[]}]},{"id":"AR23","title":"AR23 二聯式收銀機作帳流程-地方辦事處","description":"二聯式收銀機作帳流程-地方辦事處","steps":[{"id":"ar23-1","name":"Step 1: 新增空白票號","description":"每月月初，辦事處 (桃園、新竹) 將上個月的收入帳郵寄給企財處，核對以下資料：收入明細表、統一發票明細表、營業人使用二聯式收銀機統一發票明細表、作廢發票影本 (如果有)","role":"企財處","input":"空白票起訖號碼、發票日期 (上個月的最後一天)、收銀機代號、稅籍單位","output":"空白票資料","system":"財務系統（GLF2B00）","manHours":"","frequency":"","sources":[]},{"id":"ar23-2","name":"Step 2: 進入直接收款沖銷作帳","description":"檢查及核對報表資料跟銀行對帳單，進入直接收款沖銷作帳，輸入收入科目 (115104)、收款金額，填寫摘要，完成R單","role":"企財處","input":"帳務日期 (上個月的最後一天)、發票單位、收款種類 (3. 人收銀機)、發票起訖號碼、收款人員編、統制單位","output":"收款單號 (R單)、沖銷明細 (含P單號)","system":"財務系統（COF2500）","manHours":"","frequency":"","sources":[]},{"id":"ar23-3","name":"Step 3: 新增作廢號碼","description":"產生R單號後，依辦事處提供的作廢發票，輸入作廢號碼","role":"企財處","input":"作廢號碼","output":"作廢發票號碼","system":"財務系統（COF2500）","manHours":"","frequency":"","sources":[]},{"id":"ar23-4","name":"Step 4: 收款製票","description":"輸入製票資料產生傳票","role":"企財處","input":"製票人員 (收款人)、製票條件 (其他收款單)、R單號","output":"收款傳票檢查表 (W單)","system":"財務系統（COF2700）","manHours":"","frequency":"","sources":[]},{"id":"ar23-5","name":"Step 5: 核對發票資料清單","description":"列印收銀機發票資料清單，確認剛輸入空白票起訖資料皆正確","role":"企財處","input":"收銀機編號、發票日 (上個月的最後一天)","output":"收銀機發票資料清單","system":"財務系統（COR4C00）","manHours":"","frequency":"","sources":[]}]},{"id":"BIL01","title":"BIL01 人工託收票據收款與兌現流程","description":"人工託收票據收款與兌現流程","steps":[{"id":"bil01-1","name":"Step 1: 人工託收票據R單立帳","description":"輸入支票號碼、支票銀行、支票帳號、金額、銀行、到期日，選擇科目「託收票據」，列印託收票據明細表","role":"行政處出納組","input":"即/遠期支票","output":"收款R單","system":"財務系統（COF2310、COF2E10）","manHours":"","frequency":"","sources":["補充資料"]},{"id":"bil01-2","name":"Step 2: 完成沖銷產生傳票","description":"列印票據影本，附上託收票據明細表、收入認列之傳票送主管審核","role":"行政處出納組","input":"收款R單","output":"託收票據明細表、收入認列之傳票","system":"財務系統（NTR4B00、COF2700）","manHours":"","frequency":"","sources":["1st訪談","補充資料"]},{"id":"bil01-3","name":"Step 3: 每日檢查票據到期","description":"進入到期處理功能，系統自動認列收入及設算利息，並產生發票資訊、收入認列之傳票 (W單自動產生)，列印發票、託收票據明細表","role":"行政處出納組","input":"到期票據","output":"收入認列之傳票、發票、託收票據明細表","system":"財務系統（NTF2E00、COR4A00、NTR4B00）","manHours":"","frequency":"","sources":["1st訪談","補充資料"]},{"id":"bil01-4","name":"Step 4: 查詢託收票據","description":"於票據資料與製票號碼查詢，查詢已託收票據，列印託收票據明細表","role":"行政處出納組","input":"票據資料","output":"已託收之票據清單","system":"財務系統（NTF3200、NTR4B00）","manHours":"","frequency":"","sources":["補充資料"]},{"id":"bil01-5","name":"Step 5: 到期傳票異常時","description":"當原始票據異動後導致遠期到期資料出現異常需修正時，要還原遠期到期傳票後重新製票","role":"行政處出納組","input":"到期票據","output":"到期傳票","system":"財務系統（NTF2E00）","manHours":"","frequency":"","sources":["補充資料"]},{"id":"bil01-6","name":"Step 6: 銀行兌現後進入兌現處理功能","description":"輸入實際入帳金額，若有手續費輸入科目，列印兌現傳票， 列印託收票據明細表，確認所有票據狀態為「兌現」","role":"行政處出納組","input":"兌現票據","output":"兌現傳票","system":"財務系統（NTF2400、NTR4B00）","manHours":"","frequency":"","sources":["1st訪談","補充資料"]}]},{"id":"BIL02","title":"BIL02 批量託收票據收款與兌現流程","description":"批量託收票據收款與兌現流程","steps":[{"id":"bil02-1","name":"Step 1: 核對銀行代收票據資料 (USB檔)","description":"由廠商自行至銀行繳交支票，銀行製作TXT檔案給我們轉檔。銀行會提供之三項資料供核對 (txt檔、小白單、期票作業明細表)","role":"行政處出納組","input":"-","output":"-","system":"人工","manHours":"","frequency":"","sources":["1st訪談","補充資料"]},{"id":"bil02-2","name":"Step 2:票據轉檔，匯入財務系統","description":"選取『代收票據轉檔」、輸入批號及帳務日期、代收帳戶，匯入TXT檔，系統產生託收票據資料，若有即期票則傳票內會有需開立發票的資訊","role":"行政處出納組","input":"銀行託收TXT檔","output":"託收票據清單、託收票據傳票檢查表(W)","system":"財務系統（COF2A00、COR4A00）","manHours":"","frequency":"","sources":["1st訪談","補充資料"]},{"id":"bil02-3","name":"Step 3: 列印託收票據明細表","description":"輸入製票號碼 (W單)，產生託收票據明細表，確認所有票據狀態為「託收」。檢附託收票據清單及明細表，給主管覆核。(但有做兌現時，則自動由「託收」改為「兌現」字樣)","role":"行政處出納組","input":"託收票據清單、託收票據傳票檢查表(W)","output":"託收票據明細表","system":"財務系統（NTR4B00）","manHours":"","frequency":"","sources":["1st訪談","補充資料"]},{"id":"bil02-4","name":"Step 4: 每日檢查票據到期","description":"進入到期處理功能，系統自動認列收入及設算利息，並產生發票資訊、收入認列之傳票 (W單自動產生)，列印發票、託收票據明細表","role":"行政處出納組","input":"到期票據","output":"收入認列之傳票、發票、託收票據明細表","system":"財務系統（NTF2E00）","manHours":"","frequency":"","sources":["1st訪談","補充資料"]},{"id":"bil02-5","name":"Step 5: 取得銀行兌現TXT檔","description":"進入兌現處理，匯入TXT檔，產生銀行兌現處理訊儀表。若系統更新狀態為兌現(C)，列印兌現傳票。若系統更新狀態為F，將視同次交票，做直接沖銷。","role":"行政處出納組","input":"銀行兌現TXT檔","output":"銀行兌現處理訊息表","system":"財務系統（NTF2F00）","manHours":"","frequency":"","sources":["1st訪談","補充資料"]},{"id":"bil02-6","name":"Step 6: 列印託收票據明細表","description":"列印託收票據明細表，確認所有票據狀態為「兌現」，回頭補印遠期到期所產生的託收票據明細表(由「託收」轉為「兌現」)","role":"行政處出納組","input":"託收票據清單、託收票據傳票檢查表(W)","output":"託收票據明細表","system":"財務系統（NTR4B00）","manHours":"","frequency":"","sources":[]},{"id":"bil02-7","name":"Step 7: 完成兌現產生沖銷分錄","description":"修改帳務日期為銀行兌現日，產生沖銷分錄， 借銀行存款/手續費，貸託收票據","role":"行政處出納組","input":"銀行兌現日","output":"兌現傳票","system":"財務系統（NTF2C00）","manHours":"","frequency":"","sources":["1st訪談","補充資料"]}]},{"id":"BIL03","title":"BIL03 託收票據退票作業流程","description":"託收票據退票作業流程","steps":[{"id":"bil03-1","name":"Step 1: 收到銀行退票通知","description":"收到銀行退票通知，聯絡業務單位詢問廠商是否補款。","role":"行政處出納組","input":"—","output":"—","system":"人工","manHours":"","frequency":"","sources":["1st訪談","補充資料"]},{"id":"bil03-2","name":"Step 2: 若廠商願意補款","description":"若廠商願意補款，則依照原本人工託收票據流程做兌現。(流程回到BIL01-Step 1.)","role":"行政處出納組","input":"—","output":"—","system":"財務系統（COF2310、COF2E10、NTR4B00、COF2700、NTF2E00、NTF3200、NTF2400）","manHours":"","frequency":"","sources":["補充資料"]},{"id":"bil03-3","name":"Step 3: 若廠商不願意補款","description":"若廠商不願意補款，則行政處出納組須做兩件事： 1.寫簽給企財處，申請作廢到期自動跑出的發票及製作退票傳票 2.寫簽給業務單位，請業務單位做後續稽催等法律程序","role":"行政處出納組","input":"—","output":"便簽給企財處、業務單位","system":"文案系統","manHours":"","frequency":"","sources":["補充資料"]},{"id":"bil03-4","name":"S ","sources":["SOP","1st訪談","2nd訪談"]},{"id":"vat01-6","name":"Step 6: 將總額整理到 Excel","description":"從 PDF 報表抓各類發票小計與總額貼到 Excel，加總後與明細帳總額比對。","role":"行政處出納組","input":"各類銷項報表","output":"Excel 比對表","system":"Excel（人工）","manHours":"","frequency":"","sources":["SOP","1st訪談","2nd訪談"]},{"id":"vat01-7","name":"Step 7: 若不平：查明原因並調整","description":"明細帳與發票總額不平時，依未過帳（V 單）、跨月錯帳、二聯式收銀機區間事後作廢三種原因查明並調整。","role":"行政處出納組","input":"Excel 比對表","output":"差異調整結果","system":"財務系統（COR4E00、GLF2B00）","manHours":"","frequency":"","sources":["SOP","1st訪談","2nd訪談"]},{"id":"vat01-8","name":"Step 8: 核對手開發票號碼","description":"以 GLR4O00 調出當月手開發票，轉 Excel 依類別切分區間，以末號減首號檢查是否跳號（與作廢無關）。","role":"行政處出納組","input":"GLR4O00 當月報表","output":"手開發票號碼核對結果","system":"財務系統（GLR4O00）、Excel（人工）","manHours":"","frequency":"","sources":["SOP","1st訪談","2nd訪談"]},{"id":"vat01-9","name":"Step 9: 產生媒體檔","description":"檢查無誤後執行 GLR4400 產生當月媒體檔；轉入不完整時查明原因，請財會三組組長解鎖後重轉。","role":"行政處出納組、企財處（財會三組組長解鎖）","input":"核對無誤之帳表","output":"媒體檔","system":"財務系統（GLR4400）","manHours":"","frequency":"","sources":["SOP","1st訪談","2nd訪談"]},{"id":"vat01-10","name":"Step 10: 核對營業稅申報表與申報資料明細表","description":"以 GLR4N00 營業稅申報表核對各類別金額，以 GLR4M00 確認空白區間已轉入；不平時比對缺漏的資料。","role":"行政處出納組","input":"媒體檔、Excel 比對表","output":"核對結果","system":"財務系統（GLR4N00、GLR4M00、COR4C00）、Excel（人工）","manHours":"","frequency":"","sources":["2nd訪談"]}]},{"id":"VAT02","title":"VAT02 進項稅額檢查流程","description":"進項稅額檢查","steps":[{"id":"vat02-1","name":"Step 1: 檢查未過帳進項稅額","description":"以 GLF3700 查兩個月未過帳進項，通知經辦人過帳或把不急的帳改到下月；轉正式檔前每天追蹤。","role":"企財處","input":"未過帳進項資料","output":"未過帳清單、通知相關人員修改","system":"財務系統（GLF3700）、Email（人工）","manHours":"","frequency":"","sources":["2nd訪談"]},{"id":"vat02-2","name":"Step 2: 檢查已過帳進項稅額","description":"與銷項同步，以已過帳資料產生非正式媒體與申報表，比對 21–23 欄得扣抵稅額與進項稅額科目累計餘額。","role":"企財處","input":"已過帳進項資料","output":"營業稅申報表、帳與媒體差異清單","system":"財務系統（GLR4400、GLR4N00、GLF3400（推定））","manHours":"","frequency":"","sources":["SOP","1st訪談","2nd訪談"]},{"id":"vat02-3","name":"Step 3: 國稅局檢核軟體檢查與修正","description":"將循序表產出的 TXT 檔放入國稅局檢核軟體；異常時以組長權限修改原始憑證，重產再檢直到無誤。","role":"企財處","input":"進項媒體檔（TXT）","output":"檢核結果、修正後媒體檔","system":"國稅局檢核軟體、財務系統（GLR4810、GLF2110）","manHours":"","frequency":"","sources":["SOP","1st訪談","2nd訪談"]},{"id":"vat02-4","name":"Step 4: 轉正式媒體檔","description":"銷項、進項都確認無誤後，選 HO 產出正式媒體檔。","role":"企財處","input":"確認無誤之銷項、進項媒體資料","output":"正式媒體檔","system":"財務系統（GLR4400、GLR4810）","manHours":"","frequency":"","sources":["2nd訪談"]}]},{"id":"VAT03","title":"VAT03 營業稅申報、做帳與光碟流程","description":"營業稅申報、做帳與光碟","steps":[{"id":"vat03-1","name":"Step 1: 各單位完成轉檔並確認資料","description":"地方辦事處完成收銀機資料轉檔、確認無誤後，通知營業稅承辦人。","role":"地方辦事處","input":"收銀機發票資料","output":"資料確認完成通知","system":"財務系統（COF2D00）","manHours":"","frequency":"","sources":["SOP","1st訪談","2nd訪談"]},{"id":"vat03-2","name":"Step 2: 執行第二支媒體作業（上註記）","description":"營業稅承辦人執行第二支媒體作業，替各單位資料打上媒體註記（非正式檔案），完成後通知會計。","role":"行政處出納組","input":"各單位已確認資料","output":"媒體註記完成通知","system":"財務系統（GLR4400）","manHours":"","frequency":"","sources":["SOP","1st訪談","2nd訪談"]},{"id":"vat03-3","name":"Step 3: 會計產生循序檔並放入國稅局軟體","description":"會計（財會）產生循序檔，放入國稅局軟體後產出報表，交給營業稅承辦人。","role":"企財處","input":"媒體註記資料","output":"國稅局軟體報表","system":"財務系統（GLR4810）、國稅局檢核軟體","manHours":"","frequency":"","sources":["SOP","1st訪談","2nd訪談"]},{"id":"vat03-4","name":"Step 4: 提供各辦事處申報金額","description":"營業稅承辦人提供各辦事處申報金額，供其向所在地申報；南港申報書由承辦人代填。","role":"行政處出納組","input":"國稅局軟體報表","output":"各單位申報金額","system":"人工","manHours":"","frequency":"","sources":["2nd訪談"]},{"id":"vat03-5","name":"Step 5: 做帳：沖銷進銷項並付款","description":"以傳票處理新增傳票，沖銷進銷項（餘額歸零）並做付款帳，再由出納付款；於填申報書前完成。","role":"企財處、行政處出納組（付款）","input":"進銷項金額","output":"傳票、營業稅款付款","system":"財務系統（GLF2100）","manHours":"","frequency":"","sources":["2nd訪談"]},{"id":"vat03-6","name":"Step 6: 填寫總部申報書","description":"人工加總各單位銷項金額與 HO 進項金額，計算本期應繳稅額，填入總機構申報書。","role":"企財處","input":"各單位申報金額、HO 進項金額","output":"總部申報書","system":"人工","manHours":"","frequency":"","sources":["SOP","1st訪談","2nd訪談"]},{"id":"vat03-7","name":"Step 7: 憑證產生媒體作業（合併各單位媒體）", "name":"Step 3: 申辦旅行平安保險並辦理機票護照簽證","description":"隨出差申請同步申辦旅行平安保險；由政（事務組）決定承辦旅行社，辦理機票、護照、簽證手續","role":"政（事務組）/出差人","input":"申請表","output":"機票、護照、簽證、保險","system":"事務組+旅行社","manHours":"","frequency":"","sources":["SOP"]},{"id":"trv02-4","name":"Step 4: 填報公務優惠單據申請差費預支","description":"出差人填報公務優惠單據，企劃處核定差費標準後，由財務組辦理差費預支付款","role":"出差人/企劃處","input":"差費標準","output":"公務優惠單據、預支款","system":"紙本/財務系統","manHours":"","frequency":"","sources":["SOP"]},{"id":"trv02-5","name":"Step 5: 出發出差","description":"按核定行程出發，執行出差任務","role":"出差人","input":"—","output":"出差執行","system":"—","manHours":"","frequency":"","sources":["SOP"]},{"id":"trv02-6","name":"Step 6: 返國後提交出差報告及費用清單","description":"返國後填寫國際出差旅費清算單及國內出差交通費用清單，附相關單據送企劃處","role":"出差人","input":"單據","output":"旅費清算單、費用清單","system":"紙本","manHours":"","frequency":"","sources":["SOP"]},{"id":"trv02-7","name":"Step 7: 企財處核對費用報銷標準","description":"企劃處/企財處核對費用報銷標準，確認符合外貿協會職員國外出差旅費報支辦法","role":"企劃處/企財處","input":"旅費清算單","output":"核對確認結果","system":"財務系統","manHours":"","frequency":"","sources":["SOP"]},{"id":"trv02-8","name":"Step 8: 填費用還原通知單辦理多退少補","description":"出差人填「外貿協會費用還原通知單」，依實際費用與預支金額差額辦理多退少補","role":"出差人/財務組","input":"核對確認結果","output":"核銷完成記錄","system":"紙本/財務系統","manHours":"","frequency":"","sources":["SOP"]},{"id":"trv02-9","name":"Step 9: 提報出國工作報告","description":"返國後兩週內提報出國工作報告；由單位主管決定是否向上呈陳","role":"出差人/單位主管","input":"—","output":"出國工作報告","system":"紙本","manHours":"","frequency":"","sources":["SOP"]}]}]}</script>
    <script id="embedded-cats" type="application/json">["財產管理", "請購報銷", "預算管理", "收款票據", "出納作業", "營業稅", "總帳", "差旅"]</script>
    <script>
        const DATA = JSON.parse(document.getElementById('embedded-data').textContent);
        const CATEGORIES = JSON.parse(document.getElementById('embedded-cats').textContent);

        function esc(s) {
            if (s == null || s === '') return '';
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        const ATTACHMENT_LINKS = {
            '金額門檻決策表': 'attachments/採購付款流程圖.html'
        };

        function linkify(text) {
            let out = esc(text);
            Object.keys(ATTACHMENT_LINKS).forEach((kw) => {
                const url = ATTACHMENT_LINKS[kw];
                const escKw = esc(kw);
                if (out.indexOf(escKw) === -1) return;
                const link = `<a href="javascript:void(0)" class="text-blue-600 underline decoration-dotted decoration-2 underline-offset-2 font-bold hover:text-blue-800" onclick="event.stopPropagation(); openAttachment('${url}', '${escKw}')">${escKw}</a>`;
                out = out.split(escKw).join(link);
            });
            return out;
        }

        function openAttachment(url, title) {
            document.getElementById('attachment-modal-title').textContent = title || '附件';
            document.getElementById('attachment-modal-frame').src = url;
            const modal = document.getElementById('attachment-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeAttachment() {
            const modal = document.getElementById('attachment-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.getElementById('attachment-modal-frame').src = 'about:blank';
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeAttachment();
        });

        function renderContent(category) {
            const container = document.getElementById('main-content');
            container.innerHTML = '';

            const scenarios = DATA[category];

            if (!scenarios || scenarios.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl p-24 border-4 border-dashed border-slate-200 text-center">
                        <h3 class="text-2xl font-black text-slate-400 mb-3">「${esc(category)}」尚無資料</h3>
                    </div>`;
                return;
            }

            scenarios.forEach((scenario) => {
                const section = document.createElement('div');
                section.className = 'grid grid-cols-[minmax(180px,220px)_1fr] bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden mb-8';

                const stepsHtml = scenario.steps.map((step, idx) => {
                    const descBlock = step.description
                        ? `<div class="text-[13px] text-slate-600 leading-relaxed mt-2 pt-2 border-t border-slate-100"><span class="text-[10px] font-bold text-slate-400 uppercase">步驟說明</span><div class="mt-1 font-medium">${linkify(step.description)}</div></div>`
                        : '';
                    const tags = (step.sources || []).map((s) => {
                        const cls = s === 'SOP' ? 'bg-amber-100 text-amber-700 border-amber-200' :
                            s === '1st訪談' ? 'bg-indigo-100 text-indigo-700 border-indigo-200' :
                            'bg-emerald-100 text-emerald-700 border-emerald-200';
                        return `<span class="text-[10px] px-2 py-1 rounded font-black uppercase border ${cls}">${esc(s)}</span>`;
                    }).join('');

                    return `
                    <div class="flex items-center flex-shrink-0">
                        <div class="w-96 max-w-[min(24rem,92vw)] bg-slate-50 rounded-xl border border-slate-200 p-6 flex flex-col step-card shadow-sm">
                            <div class="mb-3 border-b-2 border-slate-200 pb-3">
                                <div class="text-[17px] font-black text-blue-600 uppercase tracking-tight leading-snug break-words">${esc(step.name)}</div>
                                ${descBlock}
                            </div>
                            <div class="space-y-4 mb-6">
                                <div class="flex flex-col">
                                    <span class="text-[11px] font-bold text-slate-400 uppercase mb-1">輸入資料</span>
                                    <span class="text-[14px] text-slate-700 font-semibold leading-relaxed break-words">${esc(step.input || '無')}</span>
                                </div>
                                <div class="flex flex-col">
                                    <span class="text-[11px] font-bold text-slate-400 uppercase mb-1">輸出資料</span>
                                    <span class="text-[14px] text-slate-700 font-semibold leading-relaxed break-words">${esc(step.output || '無')}</span>
                                </div>
                            </div>
                            <div class="mt-auto space-y-3 pb-8">
                                <div class="flex flex-col bg-white p-3 rounded-lg border-2 border-slate-100">
                                    <div class="flex justify-between items-center mb-2 gap-2">
                                        <span class="text-[10px] font-bold text-slate-400 uppercase shrink-0">系統 / 工具</span>
                                        <span class="text-[12px] text-blue-700 font-black text-right break-words">${esc(step.system || '-')}</span>
                                    </div>
                                    <div class="flex justify-between items-center gap-2">
                                        <span class="text-[10px] font-bold text-slate-400 uppercase shrink-0">執行角色</span>
                                        <span class="text-[12px] text-slate-600 font-bold text-right break-words">${esc(step.role || '-')}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="source-tags">${tags}</div>
                        </div>
                        ${idx < scenario.steps.length - 1 ? '<div class="mx-4 sm:mx-6 text-slate-300 font-black text-3xl shrink-0">→</div>' : ''}
                    </div>`;
                }).join('');

                section.innerHTML = `
                    <div class="bg-slate-800 text-white flex flex-col items-center justify-center text-center p-6 sm:p-8 border-r-4 border-blue-600 gap-3">
                        <span class="font-black text-base sm:text-lg leading-tight tracking-tight break-words">${esc(scenario.title)}</span>
                        ${scenario.diagramUrl ? `<a href="${scenario.diagramUrl}" target="_blank" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-md text-xs font-bold bg-blue-500 hover:bg-blue-400 text-white transition-colors whitespace-nowrap" title="查看採購作業流程圖">流程圖 ↗</a>` : ''}
                    </div>
                    <div class="flex items-stretch p-6 sm:p-10 gap-2 overflow-x-auto no-scrollbar bg-white">${stepsHtml}</div>`;
                container.appendChild(section);
            });
        }

        function switchCategory(index) {
            document.querySelectorAll('.tab-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });
            renderContent(CATEGORIES[index]);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const nav = document.getElementById('category-nav');
            CATEGORIES.forEach((cat, idx) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'tab-btn px-5 py-3 rounded-lg font-black text-sm uppercase transition-all duration-200 hover:bg-blue-50 text-slate-600';
                btn.textContent = cat;
                btn.addEventListener('click', () => switchCategory(idx));
                nav.appendChild(btn);
            });
            switchCategory(0);
        });
    </script>
</body>
